<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxury Aesthetic Background</title>
    <style>
        /* ==========================================================================
           1. RESET & BASE STYLES
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #040406; /* Hitam Onyx pekat khas luxury brand */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Mengunci posisi vertikal tepat di tengah layar */
            align-items: center; /* Mengunci posisi horizontal tepat di tengah layar */
            overflow: hidden;
            perspective: 1200px; /* Memberikan kedalaman 3D untuk elemen di atasnya */
        }

        /* ==========================================================================
           2. AESTHETIC LUXURY BACKGROUND (Ambient Aura Glow)
           ========================================================================== */
        .luxury-bg {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: -1;
            background: radial-gradient(circle at 30% 35%, rgba(212, 175, 55, 0.07) 0%, transparent 45%),
                        radial-gradient(circle at 70% 65%, rgba(124, 58, 237, 0.05) 0%, transparent 50%),
                        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.01) 0%, transparent 60%);
            animation: ambientMove 25s ease-in-out infinite alternate;
        }

        @keyframes ambientMove {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(2%, 4%) scale(1.03) rotate(3deg); }
            100% { transform: translate(-1%, -2%) scale(0.98) rotate(-2deg); }
        }

        /* ==========================================================================
           3. TRANSISI MASUK YANG MEGAH (Cinematic Entrance)
           ========================================================================== */
        .luxury-content-wrapper {
            opacity: 0;
            /* Menggunakan scale & blur-in lembut agar posisi sumbu tengahnya tidak lari */
            transform: scale(0.96) rotateX(4deg);
            filter: blur(6px);
            animation: luxuryEntrance 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        @keyframes luxuryEntrance {
            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg);
                filter: blur(0);
            }
        }

        /* ==========================================================================
           4. WADAH KONTEN (Dinamis & Mengikuti Isinya)
           ========================================================================== */
        .placeholder-box {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0%, rgba(255, 255, 255, 0.01) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.18);
            border-radius: 28px;
            padding: 35px;
            width: 36rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .isi {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center; /* Membuat baris tabel dan foto sejajar lurus secara vertikal */
            gap: 20px;
        }

        table {
            border-collapse: collapse;
            flex: 1;
        }

        table tr {
            height: 32px; /* Mengatur jarak baris teks biodata agar rapi */
        }

        .td {
            color: #a3a3a3; 
            font-size: 16px; 
            font-weight: 300;
            text-align: left;
        }

        /* Kolom khusus titik dua agar lurus sempurna ke bawah */
        .titik-dua {
            color: rgba(212, 175, 55, 0.5);
            padding: 0 12px;
            width: 10px;
        }

        .gambar {
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 20px;
            width: 9.5rem;
            height: 11.5rem;
            object-fit: cover; /* Menjaga foto Minji tetap proporsional/tidak gepeng */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        /* ==========================================================================
           5. TOMBOL RANDOM (Luxury Styling)
           ========================================================================== */
        .tombol {
            margin-top: 2rem;
            padding: 14px;
            width: 36rem; /* Lebarnya disamakan persis dengan .placeholder-box agar simetris */
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.01) 100%);
            color: #d4af37; /* Teks warna emas mewah */
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tombol:hover {
            background: rgba(212, 175, 55, 0.08);
            border-color: #d4af37;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
        }

        .tombol:active {
            transform: translateY(0);
        }
    </style>
</head>
